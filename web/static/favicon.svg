<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Pitch Black Background -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  
  <!-- Antenna / Perch Bar -->
  <line x1="12" y1="44" x2="52" y2="44" stroke="#42b8c7" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Vertical Stalk / Mast -->
  <line x1="32" y1="44" x2="32" y2="54" stroke="#333842" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="54" r="2.5" fill="#333842" />

  <!-- Perched Bird Silhouette (Geometric / Low-poly stealth) -->
